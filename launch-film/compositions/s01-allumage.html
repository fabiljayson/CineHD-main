      function cb(x1, y1, x2, y2) {
        const bx = (t) =>
          3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
        const by = (t) =>
          3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
        const dx = (t) =>
          3 * (1 - t) * (1 - t) * x1 +
          6 * (1 - t) * t * (x2 - x1) +
          3 * t * t * (1 - x2);
        return function (p) {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          let t = p;
          for (let i = 0; i < 8; i++) {
            const x = bx(t) - p;
            if (Math.abs(x) < 1e-6) break;
            const d = dx(t);
            if (Math.abs(d) < 1e-6) break;
            t -= x / d;
          }
          return by(t);
        };
      }

      var draw = cb(0.65, 0, 0.35, 1); /* trace / pulse */

      tl.fromTo("#s01-ghost", { opacity: 0.12 }, { opacity: 0, duration: 0.676, ease: std, immediateRender: false }, 1.924);

      tl.fromTo("#s01-trace", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "none", immediateRender: false }, 2.0);

      tl.fromTo("#s01-pulse", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 0.55);
      tl.fromTo("#s01-pulse", { opacity: 1 }, { opacity: 0.95, duration: 0.8, ease: "none", immediateRender: false }, 0.65);
      tl.fromTo("#s01-pulse", { opacity: 0.95 }, { opacity: 0, duration: 0.35, ease: "none", immediateRender: false }, 1.45);

      /* Flash on the gold flood (1500–2300 ms): op 0 → .85@35 % → 0,
         scale .5 → 1.12@35 % → 1.35. */

      /* CINE illuminates (1750–2250 ms); HD follows in gold (2000–2550 ms). */

      tl.fromTo("#s01-sheen", { opacity: 1 }, { opacity: 0, duration: 0.168, ease: "none", immediateRender: false }, 3.432);

      /* Haze blooms (1400–3600 ms): op 0 → 1@55 %, scale .55 → 1.08 → 1. */

      tl.fromTo("#s01-haze", { scale: 1.08 }, { scale: 1, duration: 0.99, ease: std, immediateRender: false, svgOrigin: "247.5 62" }, 2.61);

      /* Beam sweeps out (1600–3200 ms): op 0 → 1@45 % → .55, scaleX .12 → 1. */
