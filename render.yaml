# Render Blueprint — les trois services CineHD sur l'offre gratuite de Render.
# Le Worker Cloudflare (deployment/cloudflare) les atteint en `origin:https://…`.
# Offre gratuite : mise en veille après inactivité, démarrage à froid au réveil.
# Les secrets se saisissent dans le tableau de bord Render, jamais ici.
services:
  - type: web
    name: cinehd-mainapi
    runtime: docker
    plan: free
    rootDir: API/Mainapi
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Généré par Render au premier déploiement : suffit pour /health.
      - key: JWT_SECRET
        generateValue: true
      # L'instance gratuite (512 Mo) ne tient pas 12 workers cluster : un seul.
      - key: NUM_WORKERS
        value: "1"
      # DB_HOST, DB_PORT, REDIS_HOST, REDIS_PORT, REDIS_PASSWORD, TMDB_API_KEY :
      # à ajouter dans Render (Environment) quand les bases sont prêtes.

  - type: web
    name: cinehd-watchparty
    runtime: docker
    plan: free
    rootDir: API/watchpartyAPI
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: cinehd-proxy
    runtime: docker
    plan: free
    rootDir: API/proxiesembed
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

  # --- Frontend (Vite SPA + Hono static server) — plan free, déploiement push
  # via le blueprint. VITE_* intégrés à la build Docker (ARG du Dockerfile).
  # Domaine réel : Render lui assigne `cinehd-mainapp.onrender.com` ;
  # à ajuster si un domaine sur mesure est choisi.
  - type: web
    name: cinehd-mainapp
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: VITE_MAIN_API
        value: https://cinehd-mainapi.onrender.com
      - key: VITE_WATCHPARTY_API
        value: https://cinehd-watchparty.onrender.com
      - key: VITE_PROXIES_EMBED_API
        value: https://cinehd-proxy.onrender.com
      - key: VITE_SITE_URL
        value: https://cinehd-router.jasonfranckkenmognw.workers.dev
