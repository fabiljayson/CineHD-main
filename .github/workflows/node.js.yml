# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # vite@8 déclare `"node": "^20.19.0 || >=22.12.0"` : Node 18 ne peut
        # même pas charger la config, il est retiré de la matrice.
        # `npm test` exécute des fichiers .ts directement (tests/*.test.ts et
        # imports de src/**/*.ts) grâce au type stripping natif de Node, actif
        # par défaut depuis Node 22.18. Node 20 (en fin de vie depuis avril
        # 2026) échoue avec ERR_UNKNOWN_FILE_EXTENSION : il est remplacé par
        # Node 24 (LTS). La production tourne sur node:22 (Dockerfile).
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Typecheck
      # Vite ne type-check pas : sans cette étape, une régression de types
      # n'apparaît qu'à l'ouverture du fichier dans un éditeur.
      run: npm run typecheck
    - name: Lint
      # La dette actuelle est figée dans eslint-suppressions.json (erreurs) et
      # plafonnée à 219 avertissements : une nouvelle violation échoue, une
      # ancienne ne bloque pas. Régénérer la baseline avec
      # `npx eslint . --suppress-all` quand la dette baisse, et baisser le
      # plafond en même temps.
      run: npm run lint
    - name: Build
      run: npm run build --if-present
      env:
        # vite.config.ts refuse de démarrer sans origine publique : elle sert à
        # résoudre le Service Worker, le sitemap et les liens sociaux. CI n'a pas
        # de .env, on fournit donc une valeur de build non secrète.
        VITE_SITE_URL: https://cinehd.example
    - name: Test
      run: npm test

  security:
    # Contrôles hors matrice : ils ne dépendent pas de la version de Node, et le
    # scan de secrets a besoin de l'historique complet (clone superficiel =
    # aucun historique à inspecter).
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Sans fetch-depth: 0, gitleaks ne voit que le dernier commit or un
        # secret retiré d'un commit reste lisible dans les blobs précédents.
        fetch-depth: 0
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - name: Dépendances (audit)
      # Échoue sur une vulnérabilité haute ou critique. --omit=dev vise ce qui
      # est réellement exécuté en production : une faille dans un outil de build
      # ne touche pas l'utilisateur, et la corriger ne doit pas bloquer une
      # release.
      run: |
        npm audit --omit=dev --audit-level=high
        npm --prefix API/Mainapi audit --omit=dev --audit-level=high
    - name: Secrets (gitleaks)
      # --redact : un secret trouvé n'apparaît jamais en clair dans les logs de
      # CI. Les allowlists (fixtures de test, corpus de documentation, constantes
      # publiques de l'extension) sont justifiées une à une dans .gitleaks.toml.
      run: |
        VERSION=8.28.0
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP" gitleaks
        "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml \
          --redact --no-banner --exit-code 1
