<template>
  <style>

    #s03-frame {

  <script>
    (function () {
      function cb(x1, y1, x2, y2) {
        const bx = (t) =>
          3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
        const by = (t) =>
          3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
        const dx = (t) =>
          3 * (1 - t) * (1 - t) * x1 +
          6 * (1 - t) * t * (x2 - x1) +
          3 * t * t * (1 - x2);
        return function (p) {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          let t = p;
          for (let i = 0; i < 8; i++) {
            const x = bx(t) - p;
            if (Math.abs(x) < 1e-6) break;
            const d = dx(t);
            if (Math.abs(d) < 1e-6) break;
            t -= x / d;
          }
          return by(t);
        };
      }
      var expo = cb(0.16, 1, 0.3, 1); /* settle */
      var race = cb(0.5, 0, 0.9, 0.6); /* the gold sweep */
      var route = cb(0.65, 0, 0.35, 1); /* real route-change feel */
      var drift = cb(0.4, 0, 0.6, 1); /* slow camera drift */

      var tl = gsap.timeline({ paused: true });

      /* Cold-seek state: B waits off-frame right until the first façade. */
      tl.fromTo(
        "#s03-slide-b",
        { xPercent: 100 },
        { xPercent: 100, duration: 0.01 },
        0,
      );

      /* In — the wash still covers from S2's cut (yPercent 42): keep it
         rising across the cut, then recede to reveal the home. */
      tl.fromTo(
        "#s03-wash",
        { yPercent: 42, opacity: 1 },
        { yPercent: 10, opacity: 1, duration: 0.25, ease: race },
        0,
      );
      tl.to(
        "#s03-wash",
        { yPercent: 100, opacity: 0, duration: 0.65, ease: expo },
        0.25,
      );
      tl.fromTo(
        "#s03-line",
        { opacity: 1 },
        { opacity: 0, duration: 0.45, ease: expo },
        0.3,
      );

      /* Hero hold — slow drift toward the title (0.85–3.36). */
      tl.fromTo(
        "#s03-cam-a",
        { scale: 1.24 },
        { scale: 1.2499, duration: 3.06, ease: drift, transformOrigin: "0 0" },
        0.85,
      );

      /* Façade (b) #1 at bar 7 (12.36 s global): A slides left, the real
         hover state pushes in from the direction of travel. */
      tl.to("#s03-slide-a", { xPercent: -100, duration: 0.55, ease: route }, 3.36);
      tl.fromTo(
        "#s03-slide-b",
        { xPercent: 100 },
        { xPercent: 0, duration: 0.55, ease: route },
        3.36,
      );
      tl.fromTo(
        "#s03-cam-b",
        { scale: 1.24 },
        { scale: 1.2499, duration: 2.64, ease: drift, transformOrigin: "0 0" },
        3.36,
      );

      /* Façade (b) #2 — out (5.3–6.0), completes on the bar at 15.0 s. */
      tl.to("#s03-slide-b", { xPercent: -100, duration: 0.7, ease: route }, 5.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["s03-chez-toi"] = tl;
    })();
  </script>
