name: Keep Main API awake

# Render free web services sleep after 15 minutes without traffic.
# Ping the Main API every 10 minutes so the first visitor never waits
# for a cold start. Only the Main API: Render's 750 free hours a month
# cover one always-on service, not three.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 \
            https://cinehd-mainapi.onrender.com/health
