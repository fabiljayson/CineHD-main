# Render Blueprint — les trois services CineHD sur l'offre gratuite de Render.
# Le Worker Cloudflare (deployment/cloudflare) les atteint en `origin:https://…`.
# Offre gratuite : mise en veille après inactivité, démarrage à froid au réveil.
# Les valeurs `sync: false` se saisissent dans le tableau de bord Render, jamais ici.
services:
  - type: web
    name: cinehd-mainapi
    runtime: docker
    plan: free
    rootDir: API/Mainapi
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: TMDB_API_KEY
        sync: false

  - type: web
    name: cinehd-watchparty
    runtime: docker
    plan: free
    rootDir: API/watchpartyAPI
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: cinehd-proxy
    runtime: docker
    plan: free
    rootDir: API/proxiesembed
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
